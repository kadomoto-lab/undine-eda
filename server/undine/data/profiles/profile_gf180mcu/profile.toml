# What Undine needs to know about GlobalFoundries GF180MCU (docs/design/packages.md, PDK profiles; the keys are the
# fields of server/undine/pdks/pdkprofile.py's Profile, read by profiledata.py): open_pdks' gf180mcu{A..D}, decks from
# globalfoundries-pdk-libs-gf180mcu_fd_pv (libs.tech/klayout/tech). Whether Undine's tests ran it (verified) and
# whether run_checks runs Magic DRC (magic_drc) are Undine's own record, in pdks/tested.py.
schema = 1
undine = ">=0.1.0"
family = "gf180mcu"

[[profile]]
name = "gf180mcu"
label = "GlobalFoundries GF180MCU"
variants = ["gf180mcuA", "gf180mcuB", "gf180mcuC", "gf180mcuD"]
metals = ["metal1", "metal2", "metal3", "metal4", "metal5", "metaltop"]
max_metal = "metal5"
klayout_dir = "tech"
drc_klayout = ["gf180mcu.drc"]
drc_switches = "tags"
# flat: in deep mode the deck extracts no pfet that sits in a sub-cell (a PCell placed in a cell, 10/26); nfets are
# found. combine: the fingers of a device (nf, m in the schematic) are compared as one device, as SG13G2's deck does by
# default
lvs_klayout = ["gf180mcu.lvs"]
lvs_options = { run_mode = "flat", combine = true }
magic_rc = "{name}.magicrc"
netgen_setup = "{name}_setup.tcl"
pcells = true
# COMP of the well's own implant, as the LVS deck's ptap / ntap (and _dw in a deep n-well); its deck does not join a
# silicided source / drain butted to a tap, which is a short there
erc_tap = [
    ["comp", "pplus", "-nwell", "-dnwell"], ["comp", "nplus", "nwell"], ["comp", "pplus", "lvpwell", "dnwell"],
    ["comp", "nplus", "dnwell", "-lvpwell"],
]
# exercised with two gf180mcu_fd_sc_mcu7t5v0__inv_1 joined in metal2 (test_parasitics.py)
net_labels = [["contact", "metal1.label"], ["via1", "metal2.label"], ["via2", "metal3.label"], ["via3", "metal4.label"]]
model_vars = [["180MCU_MODELS", "libs.tech/ngspice"]]
model_lib = "libs.tech/ngspice/sm141064.ngspice"
model_includes = ["libs.tech/ngspice/design.ngspice"]
corners = ["typical", "ss", "ff", "sf", "fs"]
mismatch_param = "sw_stat_mismatch=1"                  # design.ngspice sets it 0; ngspice 42, not in a test
gate_layers = ["poly", "comp"]
pin_label_layers = ["metal1.label", "metal2.label", "metal3.label", "metal4.label", "metal5.label"]
stdcells = [['(gf180mcu_fd_sc_mcu[79]t5v0)__\w+', '\1']]

[profile.layers]
comp = [22, 0]
poly = [30, 0]
contact = [33, 0]
metal1 = [34, 0]
via1 = [35, 0]
metal2 = [36, 0]
via2 = [38, 0]
metal3 = [42, 0]
via3 = [40, 0]
metal4 = [46, 0]
via4 = [41, 0]
metal5 = [81, 0]
via5 = [82, 0]
metaltop = [53, 0]
pad = [37, 0]
nwell = [21, 0]
dnwell = [12, 0]
lvpwell = [204, 0]
nplus = [32, 0]
pplus = [31, 0]
dualgate = [55, 0]
pr_bndry = [0, 0]
guard_ring_mk = [167, 5]
"poly.label" = [30, 10]
"metal1.label" = [34, 10]
"metal2.label" = [36, 10]
"metal3.label" = [42, 10]
"metal4.label" = [46, 10]
"metal5.label" = [81, 10]
"metaltop.label" = [53, 10]
fusetop = [75, 0]

# density and antenna are chip-level (a shuttle target runs them on the die); CUP needs pads. As the wafer.space
# precheck.
[profile.drc_options]
"gf180mcu.drc" = { decks = "all,-density,-antenna,-cup" }

# metal stack per variant (the decks default to 6LM / 9K otherwise); from the PDK's drc/options.rb
[profile.deck_vars]
gf180mcuA = { metal_level = "3LM", metal_top = "30K", mim_option = "A" }
gf180mcuB = { metal_level = "4LM", metal_top = "11K", mim_option = "B" }
gf180mcuC = { metal_level = "5LM", metal_top = "9K", mim_option = "B" }
gf180mcuD = { metal_level = "5LM", metal_top = "11K", mim_option = "B" }

# gdsfactory 7.9 on gdstk (gf180mcu_fd_pr requirements.txt), hence an environment of its own
[profile.pcell_lib]
paths = ["tech/pymacros"]
module = "cells"
library = "gf180mcu"
init = "gf180mcu"
env = "pcell-gf180"

# V1.1 0.26, V1.3c / V1.4b end-of-line enclosure 0.06 (metal narrower than 0.34), M2.2a 0.28
[profile.strap]
via = 0.26
enc1 = [0.06, 0.06]
enc2 = [0.06, 0.06]
m2_space = 0.28
layers = ["comp", "poly", "metal1", "via1", "metal2"]

# the resistor and MIM symbols have no lvs_format: their Xname .. model r_width= .. becomes the R / C element the
# deck's reader takes (as its own gf180_xschem_klayout_spice_convert.py does for ppolyf_u)
[[profile.lvs_elements]]
model = "(ppolyf|npolyf|nplus|pplus)_[us](_[0-9a-z]+)*|nwell|rm[1-3]|tm(6|9|11|30)k"
letter = "R"
rename = { r_width = "W", r_length = "L" }

[[profile.lvs_elements]]
model = "cap_mim_[0-9a-z]+"
letter = "C"
rename = { c_width = "W", c_length = "L" }

# the stack generator gf180_stack@1 (server/undine/pdks/formulas.py) has the rules. C, D: five metals, metal5 the top
# one, the MIM on metal4. B: four, metal4 on top, the MIM on metal3. A: metal3 is the 30K top metal (its own rules,
# MT30.*: not drawn here) and the MIM is option A (on metal2, via2 lands on it)
[profile.stack]
generator = "gf180_stack@1"
thin = 4
top = "metal5"
plate = ["metal4", "via4"]

[profile.stacks.gf180mcuB]
generator = "gf180_stack@1"
thin = 3
top = "metal4"
plate = ["metal3", "via3"]

[profile.stacks.gf180mcuA]
generator = "gf180_stack@1"
thin = 2

# open_pdks 792ef670, the version wafer.space pins: exercised on gf180mcuD (KLayout DRC and LVS of
# gf180mcu_fd_sc_mcu7t5v0__inv_1, LVS matches; ngspice at typical / ss / ff)
[[pdk]]
commit = "792ef67037d74c8c51811eab3ce23cf793491296"
tested = true
license = "Apache-2.0"

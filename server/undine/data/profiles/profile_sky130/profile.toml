[[profile.stack.cuts]]
name = "licon1"
below = "tap"
above = "li1"
size = 0.17
space = 0.17
enc_below = [0.04, 0.12]
enc_above = [0.0, 0.08]
rules = "licon.1, licon.2, licon.7, li.5"

[[profile.stack.cuts]]

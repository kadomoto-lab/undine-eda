below = "poly"
above = "li1"
size = 0.17
space = 0.17
enc_below = [0.05, 0.08]
enc_above = [0.0, 0.08]
rules = "licon.1, licon.2, licon.8, licon.8a, licon.14, licon.15, li.5, npc.1, npc.2, licon.13"
extra = [["npc", 0.1, 0.27, 0.27]]
away = [["diff", 0.19], ["tap", 0.19]]

[[profile.stack.cuts]]
